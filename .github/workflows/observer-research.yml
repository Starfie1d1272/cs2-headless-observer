name: Observer Research Package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observer-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          runtime: node@24
          cache: false
          require-lockfile: true
          install: true
      - name: Fetch pinned parser source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: osztenkurden/cs2parser
          ref: deced963b86d3ec26b28a225824130fdf9fe3167
          path: .agent-tmp/observer-parser-source
          persist-credentials: false
      - name: Build parser using the locked workspace toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .agent-tmp/observer-build | Out-Null
          node client/build_parser.mjs .agent-tmp/observer-parser-source .agent-tmp/observer-build/parser_worker.mjs
      - name: Verify online entity state with synthetic binary messages
        shell: pwsh
        run: |
          pnpm exec tsx client/verify_online_entities.mjs "$env:GITHUB_WORKSPACE/.agent-tmp/observer-parser-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch pinned official SDK headers and portable runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.agent-tmp/observer-build'
          $files = @(
            @('https://codeload.github.com/ValveSoftware/Proton/tar.gz/bc896217ffcd67f892f952b010f898fe7bd0f0a1', 'sdk.tar.gz', 'be18d77ae5f9e5ce21318d151c692648e5cb7c5ffa50dea2dcac6c408966b077'),
            @('https://nodejs.org/dist/v24.22.0/node-v24.22.0-win-x64.zip', 'node-v24.22.0-win-x64.zip', 'f9683a19877e12a9b167305c8db71040d812876359de21f0d2e97c3f321f80c3'),
            @('https://www.python.org/ftp/python/3.14.8/python-3.14.8-embed-amd64.zip', 'python-3.14.8-embed-amd64.zip', 'a93abe456ab01bd96d7a085b3cdb6566b3063f4241360d114142fbdb07f0a310')
          )
          foreach ($item in $files) {
            $path = Join-Path $root $item[1]
            Invoke-WebRequest -Uri $item[0] -OutFile $path -TimeoutSec 180
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item[2]) { throw 'Pinned input digest mismatch' }
          }
          New-Item -ItemType Directory -Force "$root/sdk/steam" | Out-Null
          tar -xzf "$root/sdk.tar.gz" -C "$root/sdk/steam" --strip-components=3 'Proton-bc896217ffcd67f892f952b010f898fe7bd0f0a1/lsteamclient/steamworks_sdk_165'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the native bridge with the Windows toolchain
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          lib /nologo /machine:x64 /def:client\native\steam_api64.def /out:.agent-tmp\observer-build\steam_api64.lib
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /EHsc /O2 /MT /LD /I.agent-tmp\observer-build\sdk /I.agent-tmp\observer-build\sdk\steam client\native\sdk_host.cpp /Fo.agent-tmp\observer-build\sdk_host.obj /link .agent-tmp\observer-build\steam_api64.lib /OUT:.agent-tmp\observer-build\mizar_observer.dll
          if errorlevel 1 exit /b %errorlevel%
          dumpbin /exports .agent-tmp\observer-build\mizar_observer.dll > .agent-tmp\observer-build\exports.txt
      - name: Assemble portable client and verify bundled runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python client/package_windows.py --runtimes .agent-tmp/observer-build --native .agent-tmp/observer-build/mizar_observer.dll --parser-bundle .agent-tmp/observer-build/parser_worker.mjs --parser-source .agent-tmp/observer-parser-source --output .agent-tmp/observer-build/client --source-sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .agent-tmp/observer-build/client/runtime/python/python.exe .agent-tmp/observer-build/client/client/driver.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .agent-tmp/observer-build/client/runtime/node.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import pathlib; s=pathlib.Path('.agent-tmp/observer-build/exports.txt').read_text(); assert all(n in s for n in ['observer_create','observer_send','observer_receive','observer_auth','observer_close','observer_abi_version','observer_local_id','observer_accept_server_auth2'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mizar-observer-windows-${{ env.SOURCE_SHA }}
          path: .agent-tmp/observer-build/client.zip
          retention-days: 7
          if-no-files-found: error

