name: Observer Windows Package
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: observer-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build and test Rust observer
        working-directory: rust
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch pinned official SDK headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'work/package-build'
          New-Item -ItemType Directory -Force $root | Out-Null
          $tar = Join-Path $root 'sdk.tar.gz'
          Invoke-WebRequest -Uri 'https://codeload.github.com/ValveSoftware/Proton/tar.gz/bc896217ffcd67f892f952b010f898fe7bd0f0a1' -OutFile $tar -TimeoutSec 180
          if ((Get-FileHash $tar -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'be18d77ae5f9e5ce21318d151c692648e5cb7c5ffa50dea2dcac6c408966b077') { throw 'Pinned SDK digest mismatch' }
          New-Item -ItemType Directory -Force "$root/sdk/steam" | Out-Null
          tar -xzf $tar -C "$root/sdk/steam" --strip-components=3 'Proton-bc896217ffcd67f892f952b010f898fe7bd0f0a1/lsteamclient/steamworks_sdk_165'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the native bridge without loading Steam
        shell: pwsh
        run: |
          python tools/build_native.py --sdk work/package-build/sdk --output work/package-build/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble and verify Rust Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/observer'
          New-Item -ItemType Directory -Force $dist, "$dist/licenses", "$dist/schemas", "$dist/examples" | Out-Null
          Copy-Item 'rust/target/release/cs2-headless-observer.exe' "$dist/cs2-headless-observer.exe"
          Copy-Item 'work/package-build/native/cs2_observer.dll' "$dist/cs2_observer.dll"
          Copy-Item 'LICENSE' "$dist/licenses/cs2-headless-observer-AGPL-3.0.txt"
          Copy-Item 'LICENSE-STEAMWORKS-EXCEPTION.txt' "$dist/licenses/LICENSE-STEAMWORKS-EXCEPTION.txt"
          Copy-Item 'licenses/Steamworks-SDK.txt' "$dist/licenses/Steamworks-SDK.txt"
          Copy-Item 'THIRD_PARTY_NOTICES.md' "$dist/licenses/THIRD_PARTY_NOTICES.md"
          Copy-Item 'schemas/*' "$dist/schemas/" -Recurse
          Copy-Item 'examples/*' "$dist/examples/" -Recurse
          Copy-Item 'tests/fixtures/synthetic-channel.json' "$dist/examples/synthetic-channel.json"
          & "$dist/cs2-headless-observer.exe" replay --input "$dist/examples/synthetic-channel.json" --host-version 14191 --output 'work/package-build/replay-verify'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $contract = Get-Content 'packaging/component-contract.json' | ConvertFrom-Json
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVer = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVer -ne $contract.componentVersion) {
              throw "Tag version '$tagVer' does not match componentVersion '$($contract.componentVersion)'"
            }
          }
          $hashes = @{}
          Get-ChildItem -Path $dist -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $dist).Path.Length + 1).Replace('\', '/')
            $hashes[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest = @{
            schema = 'cs2-headless-observer-package/6'
            componentId = $contract.componentId
            componentVersion = $contract.componentVersion
            sourceSha = $env:SOURCE_SHA
            platform = $contract.platform
            nativeAbi = $contract.nativeAbi
            managedProtocol = $contract.managedProtocol
            validatedHostVersions = $contract.validatedHostVersions
            entrypoints = @{
              executable = 'cs2-headless-observer.exe'
              native = 'cs2_observer.dll'
            }
            filesSha256 = $hashes
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$dist/manifest.json" -Encoding UTF8
          $zipName = "cs2-headless-observer-$($contract.componentVersion)-windows-x64.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/$zipName" -Force
          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding UTF8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cs2-headless-observer-windows-${{ env.SOURCE_SHA }}
          path: |
            dist/cs2-headless-observer-*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem -Path 'dist' -Filter 'cs2-headless-observer-*.zip' | ForEach-Object { $_.FullName })
          $files += (Resolve-Path 'dist/SHA256SUMS.txt').Path
          gh release create $env:GITHUB_REF_NAME @files --title $env:GITHUB_REF_NAME --generate-notes
