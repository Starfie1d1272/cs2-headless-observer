name: Observer Windows Package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observer-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          runtime: node@24
          cache: false
          require-lockfile: true
          install: true
      - name: Fetch pinned parser source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: osztenkurden/cs2parser
          ref: deced963b86d3ec26b28a225824130fdf9fe3167
          path: work/parser
          persist-credentials: false
      - name: Build parser using the locked workspace toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/package-build | Out-Null
          node tools/build_parser.mjs work/parser work/package-build/parser_worker.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run required offline verification
        shell: pwsh
        run: |
          python tools/verify_all.py --parser-source work/parser --worker work/package-build/parser_worker.mjs --output work/verification/package-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch pinned official SDK headers and portable runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'work/package-build'
          $files = @(
            @('https://codeload.github.com/ValveSoftware/Proton/tar.gz/bc896217ffcd67f892f952b010f898fe7bd0f0a1', 'sdk.tar.gz', 'be18d77ae5f9e5ce21318d151c692648e5cb7c5ffa50dea2dcac6c408966b077'),
            @('https://nodejs.org/dist/v24.22.0/node-v24.22.0-win-x64.zip', 'node-v24.22.0-win-x64.zip', 'f9683a19877e12a9b167305c8db71040d812876359de21f0d2e97c3f321f80c3'),
            @('https://www.python.org/ftp/python/3.14.8/python-3.14.8-embed-amd64.zip', 'python-3.14.8-embed-amd64.zip', 'a93abe456ab01bd96d7a085b3cdb6566b3063f4241360d114142fbdb07f0a310')
          )
          foreach ($item in $files) {
            $path = Join-Path $root $item[1]
            Invoke-WebRequest -Uri $item[0] -OutFile $path -TimeoutSec 180
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item[2]) { throw 'Pinned input digest mismatch' }
          }
          New-Item -ItemType Directory -Force "$root/sdk/steam" | Out-Null
          tar -xzf "$root/sdk.tar.gz" -C "$root/sdk/steam" --strip-components=3 'Proton-bc896217ffcd67f892f952b010f898fe7bd0f0a1/lsteamclient/steamworks_sdk_165'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the native bridge without loading Steam
        shell: pwsh
        run: |
          python tools/build_native.py --sdk work/package-build/sdk --output work/package-build/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch a test-only external Node baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'node-v24.0.0-win-x64'
          $zip = 'work/package-build/external-node.zip'
          $sums = (Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.0.0/SHASUMS256.txt').Content
          $expected = (($sums -split "`n" | Where-Object { $_.Trim().EndsWith("$name.zip") }) -split '\s+')[0]
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.0.0/$name.zip" -OutFile $zip -TimeoutSec 180
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'External test Node digest mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath work/package-build/external-node
          "OBSERVER_TEST_NODE=$env:GITHUB_WORKSPACE/work/package-build/external-node/$name/node.exe" >> $env:GITHUB_ENV
      - name: Verify the full observer at minimum Node version
        shell: pwsh
        run: |
          python tools/verify_all.py --parser-source work/parser --worker work/package-build/parser_worker.mjs --node $env:OBSERVER_TEST_NODE --output work/verification/minimum-node-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble and verify the portable package
        shell: pwsh
        run: |
          python tools/package_windows.py --runtimes work/package-build --native work/package-build/native/cs2_observer.dll --parser-bundle work/package-build/parser_worker.mjs --parser-source work/parser --output dist/observer --source-sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_package.py dist/observer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_windows.py --kind external-node --runtimes work/package-build --native work/package-build/native/cs2_observer.dll --parser-bundle work/package-build/parser_worker.mjs --parser-source work/parser --output dist/observer-component --source-sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_package.py dist/observer-component --node $env:OBSERVER_TEST_NODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cs2-headless-observer-windows-${{ env.SOURCE_SHA }}
          path: |
            dist/observer.zip
            dist/observer-component.zip
          retention-days: 7
          if-no-files-found: error

