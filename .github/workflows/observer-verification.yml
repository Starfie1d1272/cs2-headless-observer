name: Observer Offline Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: observer-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          runtime: node@24
          cache: false
          require-lockfile: true
          install: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: osztenkurden/cs2parser
          ref: deced963b86d3ec26b28a225824130fdf9fe3167
          path: work/parser
          persist-credentials: false
      - name: Build the pinned parser from a clean checkout
        shell: pwsh
        run: |
          node tools/build_parser.mjs work/parser work/build/parser_worker.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run required offline checks without skipped tests
        shell: pwsh
        run: |
          python tools/verify_all.py --parser-source work/parser --worker work/build/parser_worker.mjs --output work/verification/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
# No login, game connection, Steam/CS2 DLL loading, package assembly or release.
